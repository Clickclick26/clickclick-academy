# GitHub Pages publishes every tracked file in this repo as a public URL. That
# is how 20,000 words of paid course text ended up readable at
# academy.clickclick.video/courses.json with no access code, and how the
# database SQL and internal drafts below were readable too.
#
# Jekyll runs by default here (there is no .nojekyll), so this exclude list is
# what actually keeps these paths off the web. Anything internal goes in here.
# Verify after deploying: the URLs below must return 404, not 200.
exclude:
  # NOTE: excluding a path here only stops the WEBSITE serving it. It does
  # nothing about the repo being public, so a tracked file is still readable
  # from raw.githubusercontent.com. The course content is therefore not in
  # this repo at all: see .gitignore.

  # Database schema, migrations and the setup script. Publishing your own
  # table structure is free reconnaissance for anyone poking at the backend.
  - supabase/

  # Internal drafts and specs, including the refund waiver working notes.
  - docs/

  # Repo housekeeping, no reason for any of it to be on the web.
  - README.md
  - CLAUDE.md
  - AGENTS.md
